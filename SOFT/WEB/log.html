		function palStr2HexDecoder(input) {
			var output = "",i=0;
			while (input[i*2]&&input[i*2+1]){
				output+= String.fromCharCode("0x"+input.substr(i*2,2)); 
				i++;
			}
			return output;
		}

		function palAlarmDecoder(input) {

			}

			}

			output[4]=output[2];

					for(var i_=0; i_<bv; i_++){
						output[5]+="Конечное напряжение элемента №"+(nmp==2 ? "1." : "")+(i_+1)+"     " + ((input[36+(i_*2)].charCodeAt(0) + (input[37+(i_*2)].charCodeAt(0)*256))/10) +"В "+ (nmp==2 ? ("             Конечное напряжение элемента №2."+(i_+1)+"     " + (input[46+(i_*2)].charCodeAt(0) + (input[47+(i_*2)].charCodeAt(0)*256))/10) + "В": "")+ "\n";

						}
					}
				}            

            const blob = new Blob([log_text_to_file], { type: 'text/plain' });
            
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'log.txt'; 
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
